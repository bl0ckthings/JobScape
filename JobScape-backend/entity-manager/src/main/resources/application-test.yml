spring:
  config:
    activate:
      on-profile: test
  application:
    name: entity-manager-service
  datasource:
    url: jdbc:h2:mem:entity-manager-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  cloud:
    discovery:
      enabled: false
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false

server:
  port: 8085
