<form class="detail-form flex flex-1 flex-col min-h-0" [formGroup]="form" (ngSubmit)="submit()">
  <div
    class="form-body p-6 overflow-y-auto flex-1 detail-mobile:py-[22px] detail-mobile:px-5 detail-mobile:bg-detail-surface"
  >
    <div class="form-title flex items-center justify-between gap-3 mb-6 detail-mobile:mb-[22px]">
      <h3 class="text-[15px] font-bold m-0">
        {{ reminder() ? 'Modifier un rappel' : 'Nouveau rappel' }}
      </h3>
      <app-detail-tag>À venir</app-detail-tag>
    </div>
    <div
      class="fields grid grid-cols-2 gap-x-4 gap-y-5 detail-mobile:grid-cols-1 detail-mobile:gap-[18px]"
    >
      <div class="field flex flex-col gap-[7px] min-w-0">
        <label class="text-[12px] font-semibold text-detail-ink" for="detail-reminder-date"
          >Date du rappel</label
        ><input
          id="detail-reminder-date"
          class="control w-full h-10 border border-detail-border rounded-[9px] py-[10px] px-3 [font-family:inherit] [font-style:inherit] [font-weight:inherit] [line-height:inherit] text-[13px] text-detail-ink outline-none bg-white shadow-[0_1px_2px_#0f172a03] focus:border-detail-blue focus:shadow-[0_0_0_3px_#3478f61a] placeholder:text-[#8691a3] [&[readonly]]:bg-detail-surface [&[readonly]]:text-detail-muted"
          type="date"
          formControlName="date"
          (input)="quickDay.set(null)"
          [attr.aria-invalid]="form.controls.date.touched && form.controls.date.invalid"
        />
        @if (form.controls.date.touched && form.controls.date.invalid) {
          <p class="error text-[#b42318] text-[11px]" role="alert">Choisissez une date.</p>
        }
      </div>
      <div class="field flex flex-col gap-[7px] min-w-0">
        <label class="text-[12px] font-semibold text-detail-ink" for="detail-reminder-time"
          >Heure</label
        ><input
          id="detail-reminder-time"
          class="control w-full h-10 border border-detail-border rounded-[9px] py-[10px] px-3 [font-family:inherit] [font-style:inherit] [font-weight:inherit] [line-height:inherit] text-[13px] text-detail-ink outline-none bg-white shadow-[0_1px_2px_#0f172a03] focus:border-detail-blue focus:shadow-[0_0_0_3px_#3478f61a] placeholder:text-[#8691a3] [&[readonly]]:bg-detail-surface [&[readonly]]:text-detail-muted"
          type="time"
          formControlName="time"
        />
      </div>
      <div class="field wide flex flex-col gap-[7px] min-w-0 col-span-full detail-mobile:col-auto">
        <p class="field-label text-[12px] font-semibold text-detail-ink">Échéance rapide</p>
        <div class="quick-options flex gap-2 flex-wrap">
          @for (option of quickOptions; track option.days) {
            <button
              class="py-[6px] px-3 bg-detail-surface text-detail-muted rounded-full text-[11px] font-semibold hover:text-detail-blue hover:bg-[#eff6ff] aria-pressed:text-detail-blue aria-pressed:bg-[#eff6ff]"
              type="button"
              [attr.aria-pressed]="quickDay() === option.days"
              (click)="chooseDate(option.days)"
            >
              {{ option.label }}
            </button>
          }
        </div>
      </div>
      <div class="field wide flex flex-col gap-[7px] min-w-0 col-span-full detail-mobile:col-auto">
        <label class="text-[12px] font-semibold text-detail-ink" for="detail-reminder-comment"
          >Commentaire</label
        ><textarea
          id="detail-reminder-comment"
          class="control w-full border border-detail-border rounded-[9px] py-[10px] px-3 [font-family:inherit] [font-style:inherit] [font-weight:inherit] [line-height:inherit] text-[13px] text-detail-ink outline-none bg-white shadow-[0_1px_2px_#0f172a03] focus:border-detail-blue focus:shadow-[0_0_0_3px_#3478f61a] placeholder:text-[#8691a3] min-h-[88px] h-[88px] resize-y"
          formControlName="comment"
          placeholder="Ex : relancer après entretien"
        ></textarea>
      </div>
    </div>
    <div
      class="context flex items-center gap-[10px] mt-6 p-[14px] border border-detail-border rounded-[10px] bg-detail-surface text-[12px] [&_strong]:text-[12px] [&_strong]:block [&_strong]:mb-[3px] [&_p]:text-detail-muted [&_p]:text-[11px] [&_p]:leading-[1.6] detail-mobile:bg-white"
    >
      <p>Rappel lié à la candidature {{ companyName() }}</p>
    </div>
  </div>
  <footer
    class="form-footer flex justify-end items-center gap-[10px] py-[18px] px-6 border-t border-detail-border bg-white shrink-0 detail-mobile:pt-4 detail-mobile:px-5 detail-mobile:pb-[max(16px,env(safe-area-inset-bottom))] detail-mobile:flex-wrap"
  >
    @if (reminder()) {
      <button
        class="button delete inline-flex justify-center items-center min-h-10 py-[10px] px-[18px] rounded-[10px] text-[12px] font-semibold mr-auto text-[#b42318] pl-0 detail-mobile:basis-full detail-mobile:justify-start detail-mobile:min-h-8"
        type="button"
        (click)="removed.emit()"
      >
        Supprimer
      </button>
    }
    <button
      class="button secondary inline-flex justify-center items-center min-h-10 py-[10px] px-[18px] rounded-[10px] text-[12px] font-semibold detail-mobile:min-h-11 text-white bg-[#0f172a] shadow-[0_4px_12px_#0f172a14] detail-mobile:flex-1"
      type="button"
      (click)="cancelled.emit()"
    >
      Annuler</button
    ><button
      class="button primary inline-flex justify-center items-center min-h-10 py-[10px] px-[18px] rounded-[10px] text-[12px] font-semibold detail-mobile:min-h-11 text-white bg-detail-blue shadow-[0_6px_14px_#3478f626] detail-mobile:flex-1"
      type="submit"
    >
      {{ reminder() ? 'Enregistrer' : 'Sauvegarder' }}
    </button>
  </footer>
</form>
