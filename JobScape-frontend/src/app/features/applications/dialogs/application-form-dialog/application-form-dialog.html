<section
  class="flex h-[750px] max-h-[80vh] w-full flex-col overflow-hidden rounded-[18px] border border-[#E2E8F0]/95 bg-white shadow-[0_24px_80px_rgba(15,23,42,0.18)]"
  aria-label="Ajouter une candidature"
>
  <header
    class="flex shrink-0 items-start justify-between gap-6 border-b border-[#E2E8F0] px-6 pb-3.5 pt-4"
  >
    <div>
      <h2 class="m-0 text-[18px] font-[850] leading-tight tracking-[-0.035em] text-slate-950">
        {{ title() }}
      </h2>

      <p class="mt-1 text-[12px] leading-relaxed text-slate-500">
        {{ subtitle() }}
      </p>
    </div>

    <button
      type="button"
      aria-label="Fermer"
      class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-800"
      (click)="close()"
    >
      <svg
        class="h-[18px] w-[18px]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </svg>
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" class="flex min-h-0 flex-1 flex-col">
    <main class="flex-1 overflow-y-auto px-6 pb-3.5 pt-4">
      <!-- Informations principales -->
      <section>
        <h3
          class="mb-3 flex items-center gap-[11px] text-[13px] font-[850] leading-tight tracking-[-0.02em] text-slate-950"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-slate-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 21h18"></path>
            <path d="M5 21V7l8-4v18"></path>
            <path d="M19 21V11l-6-4"></path>
            <path d="M9 9h1"></path>
            <path d="M9 13h1"></path>
            <path d="M9 17h1"></path>
          </svg>

          Informations principales
        </h3>

        <div class="grid grid-cols-2 gap-x-3 gap-y-2.5">
          <div class="flex flex-col gap-2">
            <label class="form-label" for="companyName">
              Nom de l’entreprise
            </label>

            <input
              id="companyName"
              type="text"
              placeholder="Ex. Dassault"
              formControlName="companyName"
              class="form-input"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="form-label" for="jobTitle">
              Intitulé du poste
            </label>

            <input
              id="jobTitle"
              type="text"
              placeholder="Ex: Backend Engineer"
              formControlName="jobTitle"
              class="form-input"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="form-label" for="city">
              Ville
            </label>

            <input
              id="city"
              type="text"
              placeholder="Ex: Paris"
              formControlName="city"
              class="form-input"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label class="form-label" for="country">
              Pays
            </label>

            <select
              id="country"
              formControlName="country"
              class="form-input"
            >
              <option value="" disabled>
                Sélectionner un Pays
              </option>

              @for (country of countries; track country) {
                <option [value]="country">
                  {{ country }}
                </option>
              }
            </select>
          </div>
        </div>
      </section>

      <!-- Détails de candidature -->
      <section class="mt-3.5 border-t border-[#E2E8F0] pt-3.5">
        <h3
          class="mb-3 flex items-center gap-[11px] text-[13px] font-[850] leading-tight tracking-[-0.02em] text-slate-950"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-slate-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11 4.93"></path>
            <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L13 19.07"></path>
          </svg>

          Détails de candidature
        </h3>

        <div class="grid grid-cols-2 gap-x-3 gap-y-2.5">
          <div class="flex flex-col gap-2">
            <label class="form-label" for="source">
              Canal de postulation
            </label>

            <select
              id="source"
              formControlName="source"
              class="form-input"
            >
              <option value="" disabled>
                Choisir un canal
              </option>

              @for (source of sources; track source) {
                <option [value]="source">
                  {{ source }}
                </option>
              }
            </select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="form-label" for="workMode">
              Mode de travail
            </label>

            <select
              id="workMode"
              formControlName="workMode"
              class="form-input"
            >
              <option value="" disabled>
                Choisir un mode
              </option>

              @for (workMode of workModes; track workMode) {
                <option [value]="workMode">
                  {{ workMode }}
                </option>
              }
            </select>
          </div>

          <div class="col-span-2 flex flex-col gap-2">
            <label class="form-label" for="url">
              URL de l’offre
            </label>

            <input
              id="url"
              type="url"
              placeholder="https://..."
              formControlName="url"
              class="form-input"
            />
          </div>
        </div>
      </section>

      <!-- Suivi initial -->
      <section class="mt-3.5 border-t border-[#E2E8F0] pt-3.5">
        <h3
          class="mb-3 flex items-center gap-[11px] text-[13px] font-[850] leading-tight tracking-[-0.02em] text-slate-950"
        >
          <svg
            class="h-[18px] w-[18px] shrink-0 text-slate-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2 4 5v6c0 5.5 3.8 10.2 8 11 4.2-.8 8-5.5 8-11V5z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>

          Suivi initial
        </h3>

        <div class="grid grid-cols-2 gap-x-3 gap-y-2.5">
          <div class="flex flex-col gap-2">
            <label class="form-label" for="initialStatus">
              Statut initial
            </label>

            <select
              id="initialStatus"
              formControlName="initialStatus"
              class="form-input"
            >
              <option value="" disabled>
                Choisir un statut
              </option>

              @for (status of statuses; track status) {
                <option [value]="status">
                  {{ status }}
                </option>
              }
            </select>
          </div>

          <div class="flex flex-col gap-2">
            <label class="form-label" for="initialDate">
              Date
            </label>

            <input
              id="initialDate"
              type="date"
              formControlName="initialDate"
              class="form-input"
            />
          </div>

          <div class="col-span-2 flex flex-col gap-2">
            <label class="form-label" for="comment">
              Commentaire initial
              <span class="font-semibold text-slate-400">
                (optionnel)
              </span>
            </label>

            <textarea
              id="comment"
              rows="3"
              placeholder="Ajoutez un commentaire pour vous souvenir des détails importants..."
              formControlName="comment"
              class="form-input min-h-[60px] resize-none py-2"
            ></textarea>
          </div>
        </div>

        <label
          class="mt-2.5 flex cursor-pointer items-center gap-[9px] text-[13px] font-semibold leading-tight text-slate-700"
        >
          <input
            type="checkbox"
            formControlName="createReminder"
            class="h-[15px] w-[15px] rounded border-slate-300 text-blue-600 focus:ring-blue-500/20"
          />

          Créer un rappel pour relancer plus tard

          <span
            class="grid h-4 w-4 place-items-center rounded-full border border-slate-300 text-[10px] font-extrabold text-slate-500"
          >
            i
          </span>
        </label>
      </section>
    </main>

    <footer class="flex shrink-0 items-center justify-end gap-[11px] border-t border-[#E2E8F0] px-6 pb-4 pt-3.5">
      <button
        type="button"
        class=" text-center h-[38px] min-w-[92px] rounded-[10px] bg-slate-950 text-[13px] font-bold text-white shadow-[0_10px_20px_rgba(15,23,42,0.14)] transition hover:bg-slate-900"
        (click)="close()"
      >
        Annuler
      </button>

      <button
        type="submit"
        class="text-center h-[38px] min-w-[92px] rounded-[10px] bg-gradient-to-br from-blue-600 to-blue-500 text-[13px] font-bold text-white shadow-[0_12px_26px_rgba(37,99,235,0.26)] transition hover:brightness-105 disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="form.invalid"
        (click)="submit()"
      >   
        {{ mode === 'edit' ? 'Sauvegarder' : 'Ajouter' }}
      </button>
    </footer>
  </form>
</section>
