<div class="p-[2em] mt-header-height relative flex flex-col lg:mt-0 gap-5 w-full">
  <button
    type="button"
    (click)="openCreateApplicationDialog()"
    class="cursor-pointer fixed bottom-2.5 self-center bg-primary rounded-apply-btn shadow-apply-btn px-apply-btn-x p-apply-btn-y text-sidebar-text lg:hidden"
  > + Ajouter une candidature
  </button>
  <app-applications-header></app-applications-header>

  @if (loadError()) {
    <p role="alert">Impossible de charger les candidatures.</p>
  }
  <div class="flex flex-col gap-[1em] lg:flex-row lg:items-start">
    @for (column of columns; track column.category) {
      <app-applications-status-column
        [title]="column.title"
        [applications]="applicationsByStatus()[column.category] ?? []"
      ></app-applications-status-column>
    }
  </div>




</div>
