<div class="relative mt-header-height flex min-h-full w-full flex-col gap-7 bg-[#F7F8FC] px-4 pb-24 pt-6 sm:px-6 lg:mt-0 lg:p-8">
  <button
    type="button"
    data-testid="mobile-add-application"
    (click)="openCreateApplicationDialog()"
    class="fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] left-1/2 z-30 -translate-x-1/2 whitespace-nowrap rounded-xl bg-primary px-6 py-3 text-sm font-semibold text-white shadow-apply-btn lg:hidden"
  > + Ajouter une candidature
  </button>
  <app-applications-header></app-applications-header>

  @if (loadError()) {
    <p role="alert">Impossible de charger les candidatures.</p>
  }
  <div class="flex flex-col gap-4 lg:flex-row lg:items-stretch">
    @for (column of columns; track column.category) {
      <app-applications-status-column
        [title]="column.title"
        [category]="column.category"
        [applications]="applicationsByStatus()[column.category] ?? []"
      ></app-applications-status-column>
    }
  </div>




</div>
