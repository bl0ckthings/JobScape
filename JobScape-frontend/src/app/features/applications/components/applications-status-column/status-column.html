<section class="flex min-w-0 flex-1 flex-col gap-3 rounded-xl border border-[#E6E8F0] bg-white/60 p-3.5 lg:min-h-[calc(100vh-9rem)]">
  <div class="flex items-center justify-between border-b border-[#E6E8F0] pb-3">

    <div class="flex gap-2 items-center">
      <span data-testid="status-dot" class="w-2.5 h-2.5 rounded-full shrink-0" [class]="dotColor()"></span>
      <h3 class="font-semibold text-base-size">{{ title() }}</h3>
    </div>

    <span class="flex h-6 min-w-6 items-center justify-center rounded-full border border-[#E6E8F0] bg-white px-1.5 text-xs font-medium text-secondary-font">{{ applications().length }}</span>
  </div>
  @for (application of applications(); track application.id) {
    <app-application-card [application]="application"></app-application-card>
  }

</section>
