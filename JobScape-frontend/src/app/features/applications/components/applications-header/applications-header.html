<header class="flex items-center justify-between gap-3">
  <h1 class="text-xl font-bold tracking-tight text-slate-950 sm:text-2xl">Candidatures</h1>

  <div class="flex items-center gap-2 sm:gap-3">
    <div class="relative">
      <button
        type="button"
        aria-label="Notifications"
        aria-controls="notifications-panel"
        [attr.aria-expanded]="notificationsOpen()"
        class="relative grid h-10 w-10 place-items-center rounded-lg hover:bg-white focus-visible:outline-2 focus-visible:outline-blue-600"
        (click)="toggleNotifications()"
      >
        <img src="/assets/bell.svg" alt="" class="h-5 w-5" />
        <span class="absolute right-1 top-1 h-2 w-2 rounded-full bg-red-500 ring-2 ring-[#F7F8FC]" aria-hidden="true"></span>
      </button>
      @if (notificationsOpen()) {
        <div id="notifications-panel" data-testid="notifications-panel" class="absolute right-0 top-full z-40 w-64 rounded-xl border border-[#E6E8F0] bg-white p-4 shadow-card sm:w-72">
          <p class="font-semibold text-slate-950">Notifications</p>
          <p class="mt-2 text-sm text-slate-500">Tes notifications apparaîtront ici.</p>
        </div>
      }
    </div>

    <div class="relative">
      <button
        type="button"
        aria-label="Trier les candidatures"
        aria-controls="sort-menu"
        [attr.aria-expanded]="sortOpen()"
        class="flex h-10 items-center gap-2 rounded-lg border border-[#E6E8F0] bg-white px-3 text-sm text-slate-950 hover:border-blue-300 focus-visible:outline-2 focus-visible:outline-blue-600"
        (click)="toggleSort()"
      >
        <img src="/assets/funnel.svg" alt="" class="h-4 w-4" />
        <span>{{ sortLabel() }}</span>
        <img src="/assets/arrow-sort.svg" alt="" class="h-3 w-3" />
      </button>
      @if (sortOpen()) {
        <div id="sort-menu" data-testid="sort-menu" class="absolute right-0 top-full z-40 w-48 rounded-xl border border-[#E6E8F0] bg-white p-1 shadow-card">
          <button type="button" data-testid="sort-newest" class="w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50" (click)="selectSort('Plus récentes')">Plus récentes</button>
          <button type="button" data-testid="sort-oldest" class="w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50" (click)="selectSort('Plus anciennes')">Plus anciennes</button>
          <button type="button" data-testid="sort-company" class="w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50" (click)="selectSort('Entreprise A–Z')">Entreprise A–Z</button>
        </div>
      }
    </div>
  </div>
</header>
