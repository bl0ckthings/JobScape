<div class="flex flex-col gap-2">
  <label class="text-xs font-semibold text-slate-700">
    {{ label }}
    @if (optional) {
      <span class="text-slate-400">(optionnel)</span>
    }
  </label>

  <textarea
    [rows]="rows"
    [placeholder]="placeholder"
    class="min-h-[72px] w-full resize-none rounded-[10px] border border-[#E2E8F0] bg-white px-3 py-3 text-sm leading-5 text-slate-900 shadow-[0_1px_2px_rgba(15,23,42,0.03)] outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10"
  ></textarea>

  @if (error) {
    <p class="text-xs text-red-600">{{ error }}</p>
  }
</div>
