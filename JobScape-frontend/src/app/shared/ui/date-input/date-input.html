<div class="flex flex-col gap-2">
  <label class="text-xs font-semibold text-slate-700">
    {{ label }}
  </label>

  <div
    class="flex h-10 w-full items-center rounded-[10px] border border-[#E2E8F0] bg-white px-3 text-sm text-slate-900 shadow-[0_1px_2px_rgba(15,23,42,0.03)] transition focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10"
  >
    <input
      matInput
      [matDatepicker]="picker"
      [placeholder]="placeholder"
      class="h-full flex-1 bg-transparent text-sm text-slate-900 outline-none placeholder:text-slate-400"
    />

    <button
      type="button"
      class="grid h-7 w-7 place-items-center rounded-md text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
      (click)="picker.open()"
    >
      <mat-icon class="!h-4 !w-4 !text-[16px]">calendar_today</mat-icon>
    </button>

    <mat-datepicker #picker></mat-datepicker>
  </div>

  @if (error) {
    <p class="text-xs text-red-600">{{ error }}</p>
  }
</div>
